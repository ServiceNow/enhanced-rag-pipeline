[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enhanced-rag-pipeline"
version = "0.0.1"
description = "Enhanced RAG pipeline with VLLM and Azure OpenAI support"
requires-python = "~=3.10.0"

dependencies = [
    "chromadb",
    "sentence-transformers",
    "openai>=1.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scikit-learn",
    "scipy",
    "pandas",
    "datasets>=2.14.0",
    "nltk",
    "python-dotenv",
    "pyyaml",
    "tqdm",
    "torch>=2.0.0",
    "transformers>=4.55.2,<4.57",
    "pyarrow>=12.0.0,<15.0.0",
    "tenacity>=8.0.0"
]

[project.optional-dependencies]
vllm = ["vllm==0.10.2"]

[tool.hatch.build.targets.wheel]
packages = ["core", "benchmarking", "config", "data", "evaluation", "prompts", "utils"]

# =============================================================================
# Benchmark Configuration
# =============================================================================
# Usage:
#   cp benchmark_config.example.yaml my_benchmark.yaml
#   python run_benchmark.py my_benchmark.yaml

# -----------------------------------------------------------------------------
# Dataset Configuration
# -----------------------------------------------------------------------------
# Each component (corpus, queries, qrels) can come from different sources:
# - HuggingFace: specify dataset, subset (optional), split (optional)
# - Local file: specify path

dataset:
  name: nfcorpus
  
  # --- Example 1: All from same HuggingFace dataset ---
  corpus:
    dataset: BeIR/nfcorpus
    subset: corpus        # optional, defaults to "corpus"
    split: corpus         # optional, defaults to "corpus"
  
  queries:
    dataset: BeIR/nfcorpus
    subset: queries       # optional, defaults to "queries"
    split: queries        # optional, defaults to "queries"
  
  qrels:
    dataset: BeIR/nfcorpus-qrels
    split: test           # optional, defaults to "test"

  # --- Example 2: Mix sources (uncomment to use) ---
  # corpus:
  #   dataset: BeIR/scidocs
  #   subset: corpus
  # queries:
  #   dataset: BeIR/scidocs-generated-queries  # use generated queries!
  #   split: train
  # qrels:
  #   dataset: BeIR/scidocs-qrels
  #   split: test

  # --- Example 3: Local files (uncomment to use) ---
  # corpus:
  #   path: ./data/corpus.jsonl
  # queries:
  #   path: ./data/queries.jsonl
  # qrels:
  #   path: ./data/qrels/test.tsv

# Available HuggingFace BEIR datasets (working):
# - BeIR/nfcorpus, BeIR/nfcorpus-qrels (small, medical)
# - BeIR/scifact, BeIR/scifact-qrels (small, scientific)
# - BeIR/fiqa, BeIR/fiqa-qrels (medium, financial)
# - BeIR/scidocs, BeIR/scidocs-qrels, BeIR/scidocs-generated-queries
# - BeIR/arguana, BeIR/arguana-qrels (medium, argument)
#
# Note: BeIR/hotpotqa uses deprecated dataset scripts and cannot be loaded.
# For HotpotQA, download locally and convert to BEIR format (see benchmark_config_hotpotqa.yaml)

# -----------------------------------------------------------------------------
# LLM Configuration
# -----------------------------------------------------------------------------
# Choose LLM type: vllm, gpt, or openai_compatible
llm_type: vllm
strict_llm: true

llm:
  model_name_path: meta-llama/Llama-3.2-1B-Instruct
  # base_url: http://localhost:12434/engines/v1
  max_tokens: 1000
  temperature: 0.5
  gpu_memory_utilization: 0.85
  max_model_len: 1024


# -----------------------------------------------------------------------------
# Embedding Model
# -----------------------------------------------------------------------------
embedding_model: all-MiniLM-L6-v2

# -----------------------------------------------------------------------------
# RAG Strategy
# -----------------------------------------------------------------------------
# Options: S1 (Parent), S2 (Neighbor), S3 (Synonyms), S4 (Comparative), HyDE, Query2Doc, all
strategy: S3

# Result mixing strategy (how to combine results from multiple query variations)
# Options: score_based (rank by best score), round_robin (alternate), deduplicate (simple dedup), top_k_per_set
mixing_strategy: score_based

# -----------------------------------------------------------------------------
# Prompt Configuration
# -----------------------------------------------------------------------------
# Prompt versions for each strategy
# Prompts are stored in prompts/{strategy}/{version}.txt
prompt_config:
  versions:
    neighbor: v1
    synonyms: v1
    comparative: v1
    system: v1
  
  # Optional: Override specific prompt paths (relative to project root)
  # custom_paths:
  #   neighbor: prompts/neighbor/v1.txt
  #   synonyms: prompts/synonyms/v2.txt
  #   comparative: prompts/comparative/v1.txt
  #   system: prompts/system/v1.txt

# Advanced retrieval options
use_reranking: true
rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2  # Fast reranker
use_mmr: true
mmr_lambda: 0.7  # 1.0 = relevance only, 0.0 = diversity only

# -----------------------------------------------------------------------------
# Document Chunking
# -----------------------------------------------------------------------------
chunking:
  # Options: none, fixed_size, sentence, paragraph
  strategy: sentence
  chunk_size: 512
  chunk_overlap: 50

# -----------------------------------------------------------------------------
# Evaluation Settings
# -----------------------------------------------------------------------------
top_k_values: [1, 3, 5, 10, 20]
max_queries:  # optional limit for smoke tests

# Metrics: hit, ndcg, map, recall, precision, mrr
metrics: [hit, ndcg, map, recall, precision, mrr]

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output_dir: ./benchmark_results
run_suffix:
save_per_query: false  # Save detailed per-query metrics

# -----------------------------------------------------------------------------
# Reproducibility
# -----------------------------------------------------------------------------
# Set a random seed for deterministic results (comment out for non-deterministic)
seed: 42  # Use any integer for reproducible results
